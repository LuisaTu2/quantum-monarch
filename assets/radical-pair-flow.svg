<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .box{fill:#ffffff;stroke:#e6dccd;stroke-width:1.5}
    .t{font-size:16px;font-weight:600;fill:#1d1612}
    .s{font-size:13px;fill:#776c62}
    .arrow{stroke:#1d1612;stroke-width:1.6;fill:none}
    .lab{font-size:12px;fill:#776c62;font-style:italic}
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1d1612"/>
    </marker>
  </defs>

  <!-- 1 blue light -->
  <rect class="box" x="40" y="16" width="400" height="66" rx="10"/>
  <rect x="40" y="16" width="6" height="66" rx="3" fill="#4a7fc1"/>
  <circle cx="78" cy="49" r="13" fill="#4a7fc1" opacity="0.85"/>
  <g stroke="#4a7fc1" stroke-width="2" stroke-linecap="round">
    <line x1="78" y1="28" x2="78" y2="24"/><line x1="78" y1="70" x2="78" y2="74"/>
    <line x1="57" y1="49" x2="53" y2="49"/><line x1="99" y1="49" x2="103" y2="49"/>
  </g>
  <text class="t" x="116" y="45">Blue light hits the flavin</text>
  <text class="s" x="116" y="64">inside the cryptochrome</text>
  <line class="arrow" x1="240" y1="84" x2="240" y2="112" marker-end="url(#h)"/>

  <!-- 2 radical pair -->
  <rect class="box" x="40" y="116" width="400" height="66" rx="10"/>
  <rect x="40" y="116" width="6" height="66" rx="3" fill="#a52a99"/>
  <circle cx="68" cy="149" r="8" fill="#1d1612"/><circle cx="92" cy="149" r="8" fill="#1d1612"/>
  <line x1="68" y1="143" x2="68" y2="131" stroke="#e8731c" stroke-width="3" stroke-linecap="round"/>
  <line x1="92" y1="155" x2="92" y2="167" stroke="#e8731c" stroke-width="3" stroke-linecap="round"/>
  <text class="t" x="116" y="145">A radical pair forms</text>
  <text class="s" x="116" y="164">two entangled electrons, starting as a singlet</text>
  <line class="arrow" x1="240" y1="184" x2="240" y2="212" marker-end="url(#h)"/>

  <!-- 3 field + nucleus -->
  <rect class="box" x="40" y="216" width="400" height="66" rx="10"/>
  <rect x="40" y="216" width="6" height="66" rx="3" fill="#6f8fb0"/>
  <line x1="66" y1="270" x2="66" y2="230" stroke="#6f8fb0" stroke-width="2.5" marker-end="url(#hb)"/>
  <defs><marker id="hb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6f8fb0"/></marker></defs>
  <circle cx="92" cy="249" r="7" fill="#8a6bbf"/>
  <text class="t" x="116" y="245">Earth's field + nucleus</text>
  <text class="s" x="116" y="264">make the two spins turn at different speeds</text>
  <line class="arrow" x1="240" y1="284" x2="240" y2="312" marker-end="url(#h)"/>

  <!-- 4 oscillation -->
  <rect class="box" x="40" y="316" width="400" height="66" rx="10"/>
  <rect x="40" y="316" width="6" height="66" rx="3" fill="#e8731c"/>
  <path d="M56 349 C62 333, 68 333, 74 349 S86 365, 92 349 S104 333, 106 341" stroke="#e8731c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text class="t" x="116" y="345">The pair oscillates</text>
  <text class="s" x="116" y="364">singlet ⇄ triplet, again and again</text>

  <!-- branch -->
  <text class="lab" x="240" y="410" text-anchor="middle">after about a microsecond, it ends as a…</text>
  <path class="arrow" d="M240 384 L240 394"/>
  <path class="arrow" d="M240 418 L240 428 L125 428 L125 448" marker-end="url(#h)"/>
  <path class="arrow" d="M240 428 L355 428 L355 448" marker-end="url(#h)"/>

  <!-- 5a singlet -->
  <rect class="box" x="16" y="452" width="218" height="92" rx="10"/>
  <text class="t" x="125" y="482" text-anchor="middle">Singlet</text>
  <text class="s" x="125" y="504" text-anchor="middle">the electron hops back</text>
  <text class="s" x="125" y="522" text-anchor="middle">nothing happens</text>

  <!-- 5b triplet -->
  <rect x="246" y="452" width="218" height="92" rx="10" fill="#fde3c8" stroke="#e8731c" stroke-width="1.5"/>
  <text class="t" x="355" y="482" text-anchor="middle" fill="#b4500f">Triplet</text>
  <text class="s" x="355" y="504" text-anchor="middle">a chemical product forms</text>
  <text class="s" x="355" y="522" text-anchor="middle" style="fill:#b4500f;font-weight:600">→ a signal 🦋</text>
</svg>
